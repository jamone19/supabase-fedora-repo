name: Sync Supabase CLI RPMs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-repo:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c wget jq

      - name: Fetch latest Supabase CLI release
        id: get_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_REPO: supabase/cli
        run: |
          set -euo pipefail

          api_url="https://api.github.com/repos/${SUPABASE_REPO}/releases/latest"
          echo "Fetching latest release from ${api_url}"

          release_json=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "${api_url}")

          version=$(jq -r '.tag_name // empty' <<<"${release_json}" | sed 's/^v//')
          rpm_url=$(jq -r '[.assets[]? | select(.name | test("linux(_|-)?amd64.*\\.rpm$"; "i")) | .browser_download_url][0] // empty' <<<"${release_json}")
          rpm_name=$(jq -r '[.assets[]? | select(.name | test("linux(_|-)?amd64.*\\.rpm$"; "i")) | .name][0] // empty' <<<"${release_json}")

          if [ -z "${version}" ] || [ -z "${rpm_url}" ] || [ -z "${rpm_name}" ]; then
            echo "ERROR: Failed to locate the latest Linux AMD64 RPM asset." >&2
            jq '{tag_name, assets: [.assets[]?.name]}' <<<"${release_json}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "rpm_url=${rpm_url}" >> "${GITHUB_OUTPUT}"
          echo "rpm_name=${rpm_name}" >> "${GITHUB_OUTPUT}"

      - name: Build repository artifact
        run: |
          ./build_repo.sh \
            "${{ steps.get_release.outputs.version }}" \
            "${{ steps.get_release.outputs.rpm_name }}" \
            "${{ steps.get_release.outputs.rpm_url }}"

      - name: Validate generated repository
        run: |
          set -euo pipefail

          test -f public/supabase.repo
          test "$(sed -n '1p' public/supabase.repo)" = "[supabase]"
          grep -Fqx 'baseurl=https://supabase-fedora-repo.interhosting.us/x86_64/' public/supabase.repo
          ! grep -Eiq '<!doctype|<html|<body' public/supabase.repo
          test -f public/x86_64/repodata/repomd.xml

          echo "Generated supabase.repo:"
          cat public/supabase.repo

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed repository file
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          CUSTOM_REPO_URL: https://supabase-fedora-repo.interhosting.us/supabase.repo
        run: |
          set -euo pipefail

          validate_repo_url() {
            local label="$1"
            local url="$2"
            local user_agent="$3"
            local body="/tmp/${label}.repo"
            local headers="/tmp/${label}.headers"
            local metadata="/tmp/${label}.metadata"

            echo "Verifying ${url} (${label})"

            if ! curl --location --fail --silent --show-error \
              --user-agent "${user_agent}" \
              --dump-header "${headers}" \
              --output "${body}" \
              --write-out 'status=%{http_code}\neffective_url=%{url_effective}\ncontent_type=%{content_type}\nsize=%{size_download}\n' \
              "${url}" > "${metadata}"; then
              echo "ERROR: Unable to download ${url}." >&2
              cat "${headers}" >&2 2>/dev/null || true
              cat "${metadata}" >&2 2>/dev/null || true
              return 1
            fi

            cat "${metadata}"

            local first_line
            first_line=$(sed -n '1p' "${body}" | tr -d '\r')
            if [ "${first_line}" != "[supabase]" ] || \
               grep -Eiq '<!doctype|<html|<body' "${body}"; then
              echo "ERROR: ${url} did not return the repository file." >&2
              echo "Response headers:" >&2
              sed -n '1,30p' "${headers}" >&2
              echo "Response body (${body}):" >&2
              sed -n '1,30p' "${body}" >&2
              return 1
            fi

            grep -Fqx 'baseurl=https://supabase-fedora-repo.interhosting.us/x86_64/' "${body}"
            echo "${label} verification passed."
          }

          default_repo_url="${PAGE_URL%/}/supabase.repo"

          # Verify the Pages deployment directly.
          validate_repo_url \
            "github-pages" \
            "${default_repo_url}?deployment=${GITHUB_SHA}" \
            "curl/GitHub-Actions"

          # Verify the exact public URL using a DNF-like non-browser user agent.
          # This catches custom-domain redirects, CDN cache issues, and bot/WAF rules.
          validate_repo_url \
            "custom-domain" \
            "${CUSTOM_REPO_URL}?deployment=${GITHUB_SHA}" \
            "libdnf5 (Fedora Linux; x86_64)"

          # Also verify the normal unversioned URL that users copy from the homepage.
          validate_repo_url \
            "custom-domain-unversioned" \
            "${CUSTOM_REPO_URL}" \
            "libdnf5 (Fedora Linux; x86_64)"
