name: Sync Supabase CLI RPMs

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 02:00 UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  build-repo:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    # CRITICAL FIX: Explicitly grant token generation permissions to the execution runner
    permissions:
      contents: read
      pages: write      # Grants permission to modify GitHub Pages configurations
      id-token: write   # Grants permission to mint secure OIDC tokens for validation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Install Repo Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c wget jq

      - name: Fetch Latest Supabase CLI Release Info
        id: get_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_REPO: supabase/cli
        run: |
          set -euo pipefail

          api_url="https://api.github.com/repos/${SUPABASE_REPO}/releases/latest"
          echo "Fetching latest release from $api_url"

          # Use auth and accept header to get JSON; fail on HTTP errors
          RELEASE_JSON=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "$api_url")

          # Extract tag (strip leading 'v'), and find rpm asset matching linux amd64
          VERSION=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty' | sed 's/^v//')
          RPM_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[]? | select(.name | test("linux(_|\\-)?amd64.*\\.rpm$"; "i")) | .browser_download_url' | head -n1 || true)
          RPM_NAME=$(echo "$RELEASE_JSON" | jq -r '.assets[]? | select(.name | test("linux(_|\\-)?amd64.*\\.rpm$"; "i")) | .name' | head -n1 || true)

          # Validate we found values
          if [ -z "$VERSION" ] || [ -z "$RPM_URL" ] || [ -z "$RPM_NAME" ]; then
            echo "ERROR: Failed to extract release info."
            echo "Release JSON:"
            echo "$RELEASE_JSON"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "rpm_url=$RPM_URL" >> "$GITHUB_OUTPUT"
          echo "rpm_name=$RPM_NAME" >> "$GITHUB_OUTPUT"

      - name: Execute Shell Builder Script
        run: |
          chmod +x build_repo.sh
          ./build_repo.sh "${{ steps.get_release.outputs.version }}" "${{ steps.get_release.outputs.rpm_name }}" "${{ steps.get_release.outputs.rpm_url }}"

      - name: Upload Finished Distribution Directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
