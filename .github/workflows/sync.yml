name: Sync Supabase CLI RPMs

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 02:00 UTC s
  workflow_dispatch: # Allows manual trigger

jobs:
  build-repo:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Install Repo Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c wget jq

      - name: Fetch Latest Supabase CLI Release Info
        id: get_release
        run: |
          RELEASE_JSON=$(curl -s https://api.github.com/repos/supabase/cli/releases/latest)
          VERSION=$(echo "$RELEASE_JSON" | jq -r '.tag_name' | sed 's/^v//')
          
          RPM_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith("linux_amd64.rpm")) | .browser_download_url')
          RPM_NAME=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith("linux_amd64.rpm")) | .name')
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "rpm_url=$RPM_URL" >> $GITHUB_OUTPUT
          echo "rpm_name=$RPM_NAME" >> $GITHUB_OUTPUT

      - name: Execute Shell Builder Script
        run: |
          chmod +x build_repo.sh
          ./build_repo.sh "${{ steps.get_release.outputs.version }}" "${{ steps.get_release.outputs.rpm_name }}" "${{ steps.get_release.outputs.rpm_url }}"

      - name: Commit and Push to Deploy Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git checkout -B gh-pages
          git add x86_64/ supabase.repo CNAME index.html
          
          if git diff --cached --quiet; then
            echo "No repository configuration changes detected."
          else
            git commit -m "Automated update: Sync Supabase CLI v${{ steps.get_release.outputs.version }} and rebuild docs"
            git push origin gh-pages --force
          fi

