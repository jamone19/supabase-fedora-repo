name: Sync Supabase CLI RPMs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-repo:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c wget jq

      - name: Fetch latest Supabase CLI release
        id: get_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_REPO: supabase/cli
        run: |
          set -euo pipefail

          api_url="https://api.github.com/repos/${SUPABASE_REPO}/releases/latest"
          echo "Fetching latest release from ${api_url}"

          release_json=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "${api_url}")

          version=$(jq -r '.tag_name // empty' <<<"${release_json}" | sed 's/^v//')
          rpm_url=$(jq -r '[.assets[]? | select(.name | test("linux(_|-)?amd64.*\\.rpm$"; "i")) | .browser_download_url][0] // empty' <<<"${release_json}")
          rpm_name=$(jq -r '[.assets[]? | select(.name | test("linux(_|-)?amd64.*\\.rpm$"; "i")) | .name][0] // empty' <<<"${release_json}")

          if [ -z "${version}" ] || [ -z "${rpm_url}" ] || [ -z "${rpm_name}" ]; then
            echo "ERROR: Failed to locate the latest Linux AMD64 RPM asset." >&2
            jq '{tag_name, assets: [.assets[]?.name]}' <<<"${release_json}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "rpm_url=${rpm_url}" >> "${GITHUB_OUTPUT}"
          echo "rpm_name=${rpm_name}" >> "${GITHUB_OUTPUT}"

      - name: Build repository artifact
        run: |
          ./build_repo.sh \
            "${{ steps.get_release.outputs.version }}" \
            "${{ steps.get_release.outputs.rpm_name }}" \
            "${{ steps.get_release.outputs.rpm_url }}"

      - name: Validate generated repository
        run: |
          set -euo pipefail

          test -f public/supabase.repo
          test "$(sed -n '1p' public/supabase.repo)" = "[supabase]"
          grep -Fqx 'baseurl=https://supabase-repo.interhosting.us/x86_64/' public/supabase.repo
          ! grep -Eiq '<!doctype|<html|<body' public/supabase.repo
          test -f public/x86_64/repodata/repomd.xml

          echo "Generated supabase.repo:"
          cat public/supabase.repo

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed repository file
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail

          repo_url="${PAGE_URL%/}/supabase.repo"
          echo "Verifying ${repo_url}"

          for attempt in $(seq 1 10); do
            if curl -fsSL "${repo_url}" -o /tmp/supabase.repo; then
              first_line=$(sed -n '1p' /tmp/supabase.repo | tr -d '\r')
              if [ "${first_line}" = "[supabase]" ] && \
                 ! grep -Eiq '<!doctype|<html|<body' /tmp/supabase.repo; then
                echo "Deployment verification passed."
                cat /tmp/supabase.repo
                exit 0
              fi
            fi

            echo "Deployment is not ready or returned invalid content (attempt ${attempt}/10)."
            sleep 6
          done

          echo "ERROR: The deployed supabase.repo is not a valid repository file." >&2
          sed -n '1,30p' /tmp/supabase.repo 2>/dev/null >&2 || true
          exit 1
